[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunsync-registration-core"
version = "0.1.0"
description = "Platform-neutral ArUco furniture registration and ENU integration"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-contrib-python>=4.10,<5", "pydantic>=2.7,<3", "Pillow>=10,<14"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1", "jsonschema>=4.22,<5"]

[tool.setuptools.packages.find]
include = ["sunsync_registration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
