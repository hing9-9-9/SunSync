[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunsync-hub"
version = "0.1.0"
description = "Standalone SunSync Smart Film & ThinQ ON Hub Simulator Server"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "pydantic>=2.7,<3",
    "opencv-contrib-python>=4.10,<5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1"]

[tool.setuptools.packages.find]
include = ["sunsync_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
