[project]
name = "sunsync"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
vision = [
    "ultralytics>=8.0.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "server/hub/tests"]
pythonpath = ["server/backend", "server/measure", "server/hub", "server"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["server"]

[tool.mypy]
python_version = "3.11"
mypy_path = "server/backend:server/hub:server"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
