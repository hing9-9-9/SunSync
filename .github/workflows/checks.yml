name: Checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e "./server/measure[api,test]"
      - run: ruff check server/backend server/hub server/tests
      - run: ruff format --check server/backend server/hub server/tests
      - run: mypy server/backend/app server/hub/sunsync_hub
      - run: python -m pytest server/hub/tests server/tests -q
      - run: PYTHONPATH=server/backend python -m app.scene_cli schema --check
  registration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/measure/pyproject.toml
      - run: python -m pip install -e "./server/measure[api,test]"
      - run: python -m pytest server/measure/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
