name: Native camera adapters
on:
  pull_request:
    paths: ['mobile/**', 'frontend/src/capturePolicy*', '.github/workflows/mobile-camera.yml']
  push:
    branches: [main, 'feature/**']
    paths: ['mobile/**', 'frontend/src/capturePolicy*', '.github/workflows/mobile-camera.yml']
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test mobile/MeasurementClient.test.ts frontend/src/capturePolicy.test.ts
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p mobile/android assembleDebug --no-daemon
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 mobile/ios/NativeMeasurementCapture.swift
